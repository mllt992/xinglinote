  <rect width="1200" height="520" fill="#fafafa"/>
  <style>.t{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#111}.s{font-family:Inter,'Microsoft YaHei',sans-serif;fill:#6b6b6b}.card{fill:#fff;stroke:#e4e4e7}.dark{fill:#111}.line{fill:none;stroke:#111;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}</style>
