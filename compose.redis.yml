# 可选 Redis —— 只在「想让 embedding 缓存跨进程 / 重启存活」时叠加。
# 不配也能跑：进程内 LRU 兜底，见设计 10 §5.4。
#
# 本地开发只起 Redis：
#   docker compose -f docker-compose.yml -f compose.redis.yml --profile redis up -d redis
#   （就是 pnpm redis:up）
# 整套容器部署再叠一层：
#   docker compose -f docker-compose.yml -f compose.db.yml -f compose.redis.yml --profile app up -d --build
#
# 单独成文件的理由与 compose.db.yml 相同：主文件不能因为可选件的变量插值把别人挡在门外。

services:
  redis:
    profiles: ["redis", "app"]
    image: redis:7-alpine
    ports:
      # 只绑本机。机器上已经有别的 Redis 占着 6379 时，在 .env 改 REDIS_HOST_PORT 错开。
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--save", "60", "1000", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:
