name: knowledge

# 数据库连哪里，只由 .env 的 DATABASE_URL 决定；下面的 db 服务只是「懒得自己装 Postgres」时的便利品。
# 已经有现成实例（本机别的容器、云上托管库）就别开 db profile，配好 DATABASE_URL 直接用。
#
# 只起自带数据库：docker compose --profile db up -d db     （pnpm db:up 就是这个）
# 整套部署：      docker compose --profile app up -d --build    （db 一并起）
# 带 TLS：        docker compose --profile app --profile tls up -d --build

services:
  db:
    # 默认不启动：不开 profile 就不会有人来抢宿主机的 5432。
    # 同时挂在 app 下，是为了 --profile app 整套部署时它能被 depends_on 拉起来。
    profiles: ["db", "app"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?在 .env 里设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?在 .env 里设置 POSTGRES_DB}
    ports:
      # 只绑本机，别把数据库暴露到公网
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build: .
    command: ["migrate"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - kbdata:/data
    restart: "no"

  api:
    profiles: ["app"]
    build: .
    command: ["api"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: "12099"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # 前面挂反代时保持只绑本机；不挂反代要对外就改成 "12099:12099"
      - "127.0.0.1:12099:12099"
    volumes:
      - kbdata:/data
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    command: ["worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - kbdata:/data
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      KB_DOMAIN: ${KB_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  kbdata:
  caddydata:
  caddyconfig:
