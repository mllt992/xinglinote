name: knowledge

# 数据库连哪里，只由环境变量决定，这个文件里没有任何数据库实例。
#   DATABASE_URL           宿主机上的进程（pnpm dev / db:push / verify-* 脚本）怎么连
#   DATABASE_URL_INTERNAL  容器里的进程怎么连。不配就回落到 DATABASE_URL——
#                          数据库有真实主机名时这样就够了；只有当 DATABASE_URL 写的是
#                          127.0.0.1（在容器里指的是容器自己）才必须单独配这个。
#
# 整套部署（接你自己的数据库）：
#   docker compose --profile app up -d --build
# 带 TLS：
#   docker compose --profile app --profile tls up -d --build
#
# 手上没有现成的 Postgres，想用仓库自带的，叠加 compose.db.yml：
#   docker compose -f docker-compose.yml -f compose.db.yml --profile app up -d --build
# 只起一个开发用的库（就是 pnpm db:up）：
#   docker compose -f docker-compose.yml -f compose.db.yml --profile db up -d db

services:
  migrate:
    profiles: ["app"]
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["migrate"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-${DATABASE_URL}}
    # 镜像里的 HEALTHCHECK 是打 /api/healthz 的，只对 api 成立。三个服务共用同一个镜像
    # （靠 entrypoint 的参数分流），不关掉的话这里会一直红着——建完表就退出的容器，
    # 探活本来也没有意义。
    healthcheck:
      disable: true
    volumes:
      - kbdata:/data
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["api"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-${DATABASE_URL}}
      API_PORT: "12099"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 前面挂反代时保持只绑本机；不挂反代要对外就改成 "12099:12099"
      - "127.0.0.1:12099:12099"
    volumes:
      - kbdata:/data
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    command: ["worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-${DATABASE_URL}}
    # 同上：worker 不起 HTTP 服务，镜像里那条 fetch /api/healthz 必然 ECONNREFUSED，
    # 于是它永远显示 unhealthy——功能其实一直正常（轮询 background_jobs）。
    # 留着这个假红灯的代价是真出事时没人会当回事，以及给它配重启/告警时会误触发。
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - kbdata:/data
    restart: unless-stopped

  caddy:
    profiles: ["tls"]
    image: caddy:2
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      KB_DOMAIN: ${KB_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  kbdata:
  caddydata:
  caddyconfig:
